# Legacy settings retained for interpreting historical solid-temperature data.
# Not used by the adiabatic CFD study; the solid thermal runner is disabled.
# Wall temperature evolves under conduction and optional radiation.
# No adiabatic reference solution or endpoint-derived convection is required.

mapdl_version: 251
processors: 4

boundary_csv: null
mesh_size_m: null
initial_temperature_k: null

include_radiation: true
emissivity: null
radiation_temperature_k: null

loading:
  mode: fixed_heat_flux

material:
  name: Tungsten
  conductivity_w_mk: 170.0
  density_kg_m3: 19250.0
  specific_heat_j_kgk: 130.0

transient:
  duration_s: 400.0
  initial_time_step_s: null
  min_time_step_s: null
  max_time_step_s: null

visualization:
  enabled: true
  save_final_temperature_image: true
  save_heat_flux_image: true
  save_temperature_history_image: true
  make_gif: true
  save_frame_pngs: false
  max_animation_frames: 60
  fps: 8
  dpi: 160

# No service-temperature limit is assumed. Use a justified material/TPS limit.
design_limits:
  max_temperature_k: null
