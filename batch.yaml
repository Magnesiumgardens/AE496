# Primary RE CFD + cold calibration -> transient surface-load Mechanical study.
geometry_directory: ./geometry_batch
geometry_glob: "*.x_t"
base_config: ./config.yaml
thermal_config: ./thermal_analysis.yaml
runs_directory: ./runs
resume: true
stop_on_error: false
run_cfd: true
run_thermal: true
force_fluent_gui: false
comparison_outputs: true

# Only the owned child process tree is stopped on timeout.
timeouts:
  mesh:
    hard_s: 7200
    inactivity_s: 600
  solver:
    hard_s: 7200
    inactivity_s: 1200
  temperature_export:
    hard_s: 1200
    inactivity_s: 600
  aero:
    hard_s: 1200
    inactivity_s: 600
  calibration:
    hard_s: 9000
    inactivity_s: 1200
  thermal:
    hard_s: 5400
    inactivity_s: 1200
