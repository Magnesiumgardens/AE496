# Sequential adiabatic CFD study; one Fluent job at a time.
geometry_directory: ./geometry_batch
geometry_glob: "*.x_t"
base_config: ./config.yaml
runs_directory: ./runs
resume: true
stop_on_error: false
run_cfd: true
force_fluent_gui: false
comparison_outputs: true

# Only the owned child process tree is stopped on timeout.
timeouts:
  mesh:
    hard_s: 7200
    inactivity_s: 600
  solver:
    hard_s: 7200
    inactivity_s: 1200
  temperature_export:
    hard_s: 1200
    inactivity_s: 600
  aero:
    hard_s: 1200
    inactivity_s: 600
